<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Oryko</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="svg/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Marcellus:wght@400;700&family=Urbanist:wght@300;400;600&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/normalize.css">
  <link rel="stylesheet" href="css/skeleton.css">
  <link rel="stylesheet" href="css/dark-skeleton.css">
  <link rel="stylesheet" href="css/oryko.css">
  <script src="js/dark-theme.js"></script>
</head>
<body>
  <div class="container">
    <div id="toolbar">
      <select id="lang-select" class="neu" aria-label="Language">
        <option value="en">EN</option>
        <option value="es">ES</option>
        <option value="gl">GL</option>
      </select>
      <button id="theme-switch" class="neu" aria-label="Toggle theme">
        <i class="fa-solid fa-circle-half-stroke" aria-hidden="true"></i>
      </button>
    </div>

    <header>
      <div id="hero">
        <div class="two-thirds column" id="hero-text">
          <div>
            <img id="brand-logo-img" src="svg/brandlogo-light.svg" alt="ORYKO" class="brand-logo">
            <p>Casio modding &amp; leather accessories. Coming soon.</p>
          </div>
          <form action="#" method="post">
            <div class="card row neu-inset">
                <p> We'll email you when it's ready.</p>
                <input type="email" class="neu u-max-full-width " placeholder="your@email.com">
                <button type="submit" class="neu-btn neu-btn-primary">Notify Me</button>
            </div>
          </form>
        </div>
        <div class="one-third column" id="hero-media">
          <img src="img/wrist.jpg" class="neu-lg" width="100%" alt="Watch on wrist">
        </div>
      </div>
    </header>

    <footer>
      <p>&copy; 2026 Oryko</p>
    </footer>
  </div>
</body>
</html>
